
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Login Demo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    background: #1f1f1f;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}
.container {
    width: 100%;
    max-width: 400px;
    padding: 20px 0;
}
h2 {
    font-size: 25px;
    margin-bottom: 38px;
}
.form {
    display: none;
    animation: fade .3s ease;
}
.form.active {
    display: block;
}
@keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
input {
    width: 100%;
    height: 65px;
    background: transparent;
    border: 1px solid #555;
    border-radius: 17px;
    padding: 0 25px;
    font-size: 17px;
    color: white;
    outline: none;
    margin-bottom: 18px;
}
input:focus { border-color: #0095f6; }
input::placeholder { color: #aaa; }
button {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 40px;
    background: #1877db;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 18px;
}
button:hover { background: #0866c6; }
.forgot {
    text-align: center;
    margin-top: 38px;
    font-size: 18px;
    cursor: pointer;
    color: white;
}
.bottom { margin-top: 70px; }
.facebook {
    background: #292a2c;
    color: #ccc;
    margin-bottom: 18px;
}
.switch {
    background: transparent;
    border: 1px solid #0095f6;
    color: #399cff;
    margin-top: 0;
}
.note {
    text-align: center;
    color: #aaa;
    margin-top: 25px;
    font-size: 13px;
    background: #2a2a00;
    padding: 8px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

    <div class="form active" id="loginForm">
        <h2>Lab Login Demo</h2>
        <form id="loginFormElement" onsubmit="demoLogin(event)">
            <input id="loginEmail" type="email" placeholder="Email address" autocomplete="email" required>
            <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit">Log in</button>
        </form>
        <div class="forgot" onclick="alert('Password recovery is not available in this demo.')">Forgot password?</div>
        <div class="bottom">
            <button class="facebook" type="button" onclick="alert('Social login is not enabled for this demo.')">Social login demo</button>
            <button class="switch" type="button" onclick="showSignup()">Create new account</button>
        </div>
    </div>

    <div class="form" id="signupForm">
        <h2>Create demo account</h2>
        <form id="signupFormElement" onsubmit="demoSignup(event)">
            <input id="signupFullName" type="text" placeholder="Full name" autocomplete="name" required>
            <input id="signupUsername" type="text" placeholder="Username" autocomplete="username" required>
            <input id="signupEmail" type="email" placeholder="Email address" autocomplete="email" required>
            <input id="signupPassword" type="password" placeholder="Create password" autocomplete="new-password" minlength="8" required>
            <button type="submit">Sign up</button>
        </form>
        <div class="bottom">
            <button class="switch" type="button" onclick="showLogin()">Already have an account? Log in</button>
        </div>
    </div>

    <p class="note">EDUCATIONAL DEMO APPLICATION</p>

</div>

<script>
// Render-hosted Express API. For local development, change this temporarily
// to "http://localhost:5000".
const API_BASE_URL = "https://instagram-fake.onrender.com";

function showSignup() {
    document.getElementById("loginForm").classList.remove("active");
    document.getElementById("signupForm").classList.add("active");
}

function showLogin() {
    document.getElementById("signupForm").classList.remove("active");
    document.getElementById("loginForm").classList.add("active");
}

async function demoLogin(event) {
    event.preventDefault();

    const button = event.currentTarget.querySelector("button[type='submit']");
    button.disabled = true;
    button.textContent = "Logging in...";

    try {
        const response = await fetch(`${API_BASE_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: document.getElementById("loginEmail").value.trim(),
                password: document.getElementById("loginPassword").value
            })
        });
        const result = await response.json();

        if (!response.ok) throw new Error(result.message || "Login failed");
        alert("Demo login successful!");
        event.currentTarget.reset();
    } catch (error) {
        alert(error.message || "Unable to reach the demo server.");
    } finally {
        button.disabled = false;
        button.textContent = "Log in";
    }

}

async function demoSignup(event) {
    event.preventDefault();

    const button = event.currentTarget.querySelector("button[type='submit']");
    button.disabled = true;
    button.textContent = "Creating account...";

    try {
        const response = await fetch(`${API_BASE_URL}/signup`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                fullName: document.getElementById("signupFullName").value.trim(),
                username: document.getElementById("signupUsername").value.trim(),
                email: document.getElementById("signupEmail").value.trim(),
                password: document.getElementById("signupPassword").value
            })
        });
        const result = await response.json();

        if (!response.ok) throw new Error(result.message || "Signup failed");
        alert("Demo account created. You can now log in.");
        event.currentTarget.reset();
        showLogin();
    } catch (error) {
        alert(error.message || "Unable to reach the demo server.");
    } finally {
        button.disabled = false;
        button.textContent = "Sign up";
    }

}
</script>

</body>
</html>
